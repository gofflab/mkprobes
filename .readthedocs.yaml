version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py

python:
  install:
    - requirements: docs/requirements.txt
    # sphinx-click imports mkprobes.cli to render the CLI reference, so the
    # package itself has to be installed, not just the Sphinx toolchain.
    - method: pip
      path: .
