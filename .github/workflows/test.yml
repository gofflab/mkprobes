name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: uv run --extra dev pytest

  integration:
    # The `external` tests are the only ones that exercise the real gffread,
    # bowtie2 and jellyfish invocations. Without the tools installed they are
    # silently deselected, so the one end-to-end path in the suite never ran.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: mkprobes-ci
          create-args: >-
            python=3.12
            gffread
            bowtie2
            kmer-jellyfish
          condarc: |
            channels:
              - conda-forge
              - bioconda
      - name: Install the package
        shell: bash -el {0}
        run: pip install -e ".[dev]"
      - name: Confirm the external tools are on PATH
        shell: bash -el {0}
        run: gffread --version && bowtie2 --version | head -1 && jellyfish --version
      - name: Run the integration tests
        shell: bash -el {0}
        # -m external selects only the tools-dependent tests; they must actually
        # run, so treat "no tests collected" (exit 5) as a failure.
        run: pytest -m external -v
