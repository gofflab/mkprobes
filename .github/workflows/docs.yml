name: docs

on:
  push:
    branches: [main]
  # The docs build imports the package (sphinx-click renders the CLI reference
  # from the live command tree), so a code change can break it. Building on
  # pull requests catches that before merge instead of after.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Build docs
        # No --no-project: sphinx-click imports mkprobes.cli to render the CLI
        # reference, so the package and its dependencies must be installed.
        # Sphinx pins live only in docs/requirements.txt so the two cannot drift.
        run: >
          uv run --with-requirements docs/requirements.txt
          sphinx-build -W docs docs/_build/html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    # Pull requests build the docs but must not publish them.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
